# Railway baut vom Monorepo-Root – dieser Pfad ist relativ zum Root
# Railway-Service-Einstellungen:
#   Root Directory: / (leer lassen)
#   Build Command:  pnpm install && pnpm storefront:build
#   Start Command:  pnpm storefront:start

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm install -g pnpm@10 && pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm storefront:build"]

[start]
cmd = "pnpm storefront:start"
